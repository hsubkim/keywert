<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>keywert > insight 관리</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body { font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #fff; min-width: 1280px; }
    .container { max-width: 1160px; margin: 0 auto; padding: 0 52px; }
    header { position: sticky; top: 0; z-index: 200; background: #fff; border-bottom: 1px solid #E5E7EB; }
    header .container { max-width: none; }
    .header-inner { display: grid; grid-template-columns: auto 1fr auto; align-items: center; height: 64px; gap: 16px; }
    .logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
    .logo-img { height: 28px; width: auto; display: block; }
    .logo-fallback { display: none; align-items: center; gap: 7px; font-size: 20px; font-weight: 700; color: #29B8D8; letter-spacing: -0.02em; }
    nav { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .nav-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 8px 16px; font-size: 16px; font-weight: 700; color: #111827;
      cursor: pointer; border-radius: 8px; background: none; border: none;
      font-family: inherit; text-decoration: none; transition: background 0.15s, color 0.15s;
    }
    .nav-btn:hover { background: #F3F4F6; }
    .nav-btn.active { color: #0BB8C9; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .btn-text { padding: 5px 4px; font-size: 12px; font-weight: 500; color: #6B7280; text-decoration: none; border-radius: 6px; transition: background 0.15s, color 0.15s; white-space: nowrap; }
    .btn-text:hover { background: #F3F4F6; color: #374151; }
    .btn-divider { width: 1px; height: 12px; background: #E5E7EB; margin: 0; flex-shrink: 0; }
    .btn-primary { padding: 8px 18px; background: #00AACB; color: #fff; font-size: 14px; font-weight: 600; border-radius: 8px; text-decoration: none; border: none; cursor: pointer; font-family: inherit; transition: background 0.15s; white-space: nowrap; }
    .btn-primary:hover { background: #008FA8; }
    .mypage-layout { display: flex; min-height: calc(100vh - 64px); }
    .mypage-side {
      width: 240px; flex-shrink: 0;
      border-right: 1px solid #E5E7EB;
      padding: 40px 0;
    }
    .side-nav-title { font-size: 11px; font-weight: 700; color: #9CA3AF; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 24px 12px; }
    .side-nav ul { list-style: none; }
    .side-nav ul li a {
      display: block; padding: 10px 24px; font-size: 14px; font-weight: 500;
      color: #374151; text-decoration: none; border-radius: 0;
      transition: color 0.15s, background 0.15s;
    }
    .side-nav ul li a:hover { color: #0BB8C9; background: #F0FDFF; }
    .side-nav ul li a.active { color: #0BB8C9; font-weight: 700; background: #F0FDFF; }
    .mypage-content { flex: 1; padding: 48px 60px; }
    .page-title { font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 32px; letter-spacing: -0.02em; }
    .placeholder-area {
      border: 2px dashed #E5E7EB; border-radius: 12px;
      padding: 80px 24px; text-align: center; color: #9CA3AF; font-size: 14px;
      background: #FAFAFA;
    }
    .placeholder-area span { display: block; font-size: 12px; margin-top: 6px; color: #D1D5DB; }
  </style>
</head>
<body>
<header>
  <div class="container">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="keywert" class="logo-img"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <span class="logo-fallback">keywert</span>
      </a>
      <nav>
        <a href="insight.html" class="nav-btn">Insight</a>
        <a href="pro.html" class="nav-btn">Pro</a>
        <a href="chemistry.html" class="nav-btn">Chemistry</a>
      </nav>
      <div class="header-actions" id="appHeaderActions"></div>
    </div>
  </div>
</header>
<div class="mypage-layout">
  <aside class="mypage-side">
    <nav class="side-nav">
      <div class="side-nav-title">마이페이지</div>
      <ul>
        <li><a href="mypage_info.html">내 정보</a></li>
        <li><a href="mypage_subscription.html">구독 관리</a></li>
        <li><a href="insight_manage.html" class='active'>Insight 관리</a></li>
        <li><a href="pro_manage.html">Pro 관리</a></li>
        
      </ul>
    </nav>
  </aside>
  <div class="mypage-content">
    <h1 class="page-title">Insight 관리</h1>
    <div class="placeholder-area">
      콘텐츠 영역
      <span>피그마 디자인 연결 예정</span>
    </div>
  </div>
</div>
<script src="auth.js"></script>
<script>
  (function() {
    var user; try { user = JSON.parse(localStorage.getItem('kw_user')); } catch(e) { user = null; }
    var el = document.getElementById('appHeaderActions');
    if (!el) return;
    if (user) {
      el.innerHTML = '<span style="font-size:13px;color:#374151;">' + user.name + '</span><div class="btn-divider"></div><button class="btn-text" style="background:none;border:none;cursor:pointer;font-family:inherit;" onclick="localStorage.removeItem('kw_user');location.href='index.html'">로그아웃</button>';
    } else {
      el.innerHTML = '<a href="login.html" class="btn-text">로그인</a><div class="btn-divider"></div><a href="signup.html" class="btn-primary">무료 체험</a>';
    }
  })();
</script>
</body>
</html>
