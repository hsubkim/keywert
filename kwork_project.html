<!DOCTYPE html>
<html lang="ko">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; height: 100%; }
    body { font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #fff; min-width: 1280px; height: 100%; display: flex; flex-direction: column; overflow: hidden; }

    /* ── GNB ── */
    .kp-header { height: 64px; background: #fff; border-bottom: 1px solid #E5E7EB; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; position: relative; }
    .kp-logo { display: flex; align-items: center; gap: 6px; text-decoration: none; }
    .kp-logo-img { height: 26px; width: auto; }
    .kp-logo-fallback { display: none; align-items: center; gap: 6px; }
    .kp-logo-kwork { font-size: 15px; font-weight: 800; color: #374151; letter-spacing: -0.02em; padding-left: 6px; border-left: 1.5px solid #E5E7EB; margin-left: 2px; }
    .kp-left { display: flex; align-items: center; gap: 0; }
    .kp-proj-select { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 10px; background: none; border: none; font-family: inherit; cursor: pointer; border-radius: 8px; transition: background 0.15s; margin-left: 80px; }
    .kp-proj-select:hover { background: #F3F4F6; }
    .kp-proj-badge { width: 28px; height: 28px; border-radius: 50%; background: #9333EA; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .kp-proj-name { font-size: 15px; font-weight: 700; color: #111827; white-space: nowrap; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
    .kp-proj-chevron { color: #6B7280; flex-shrink: 0; }
    .kp-header-right { display: flex; align-items: center; flex-shrink: 0; }
    .btn-text { padding: 5px 4px; font-size: 12px; font-weight: 500; color: #6B7280; text-decoration: none; border-radius: 6px; transition: background 0.15s, color 0.15s; white-space: nowrap; cursor: pointer; background: none; border: none; font-family: inherit; }
    .btn-text:hover { background: #F3F4F6; color: #374151; }
    .btn-divider { width: 1px; height: 12px; background: #E5E7EB; flex-shrink: 0; margin: 0 4px; }
    .user-info { display: flex; align-items: center; gap: 6px; }
    .user-icon { width: 28px; height: 28px; border-radius: 50%; background: #E0F2F8; display: flex; align-items: center; justify-content: center; color: #00AACB; flex-shrink: 0; }

    /* ── LAYOUT ── */
    .kp-layout { display: flex; flex: 1; overflow: hidden; }

    /* ── SIDEBAR ── */
    .kp-sidebar { width: 280px; flex-shrink: 0; border-right: 1px solid #E5E7EB; background: #fff; display: flex; flex-direction: column; overflow: hidden; }
    .kp-sidebar-toolbar { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #F3F4F6; flex-shrink: 0; }
    .kp-new-folder-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; height: 32px; background: #F3F4F6; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; color: #374151; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .kp-new-folder-btn:hover { background: #E5E7EB; }
    .kp-refresh-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid #E5E7EB; border-radius: 6px; background: #fff; color: #6B7280; cursor: pointer; flex-shrink: 0; transition: border-color 0.15s; }
    .kp-refresh-btn:hover { border-color: #9CA3AF; color: #374151; }
    .kp-sidebar-body { flex: 1; overflow-y: auto; }

    /* Project item (selected) */
    .kp-proj-item { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #0B4D5E; color: #fff; cursor: pointer; }
    .kp-proj-item-icon { flex-shrink: 0; opacity: 0.9; }
    .kp-proj-item-name { flex: 1; font-size: 13px; font-weight: 600; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .kp-proj-item-count { font-size: 12px; opacity: 0.8; flex-shrink: 0; }

    /* Tree */
    .kp-tree { padding: 6px 0; }
    .kp-tree-section { }
    .kp-tree-head { display: flex; align-items: center; gap: 4px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: #111827; cursor: pointer; user-select: none; transition: background 0.12s; }
    .kp-tree-head:hover { background: #F9FAFB; }
    .kp-tree-arrow { font-size: 9px; color: #6B7280; transition: transform 0.2s; flex-shrink: 0; }
    .kp-tree-section.open .kp-tree-arrow { transform: rotate(90deg); }
    .kp-tree-name { flex: 1; }
    .kp-tree-count { font-size: 12px; color: #6B7280; font-weight: 400; }
    .kp-tree-children { padding: 0; }
    .kp-tree-child { display: flex; align-items: center; gap: 4px; padding: 6px 14px 6px 26px; font-size: 12px; color: #6B7280; cursor: pointer; transition: background 0.12s; user-select: none; }
    .kp-tree-child:hover { background: #F9FAFB; color: #374151; }
    .kp-child-arrow { font-size: 8px; color: #9CA3AF; flex-shrink: 0; }
    .kp-child-name { flex: 1; }
    .kp-child-count { font-size: 11px; color: #9CA3AF; }

    /* ── MAIN ── */
    .kp-main { flex: 1; overflow-y: auto; background: #fff; }
    .kp-main-inner { padding: 16px 36px 60px; max-width: 1100px; }

    /* Project header */
    .kp-proj-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 24px; }
    .kp-badge { width: 40px; height: 40px; border-radius: 50%; background: #9333EA; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .kp-title { flex: 1; font-size: 20px; font-weight: 800; color: #111827; letter-spacing: -0.02em; line-height: 1.4; padding-top: 6px; }
    .kp-header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-top: 4px; }
    .kp-ai-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border: 1.5px solid #00AACB; border-radius: 8px; background: #fff; color: #00AACB; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background 0.15s; white-space: nowrap; }
    .kp-ai-btn:hover { background: #F0FDFF; }
    .kp-action-btn { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 1px solid #E5E7EB; border-radius: 7px; background: #fff; color: #6B7280; cursor: pointer; transition: border-color 0.12s, background 0.12s; }
    .kp-action-btn:hover { border-color: #9CA3AF; background: #F9FAFB; }

    /* Info + memo row */
    .kp-info-row { display: flex; gap: 20px; margin-bottom: 28px; }
    .kp-info-card { flex: 1; border: 1px solid #E5E7EB; border-radius: 8px; padding: 6px 16px; }
    .kp-info-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #F3F4F6; }
    .kp-info-item:last-child { border-bottom: none; }
    .kp-info-label { width: 90px; font-size: 13px; color: #6B7280; flex-shrink: 0; }
    .kp-info-value { font-size: 13px; color: #111827; }
    .kp-info-value.bold { font-weight: 700; }

    .kp-memo { width: 380px; flex-shrink: 0; background: #FFFDE7; border: 1px solid #FFF59D; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; min-height: 160px; }
    .kp-memo-text { flex: 1; font-size: 13px; color: #BDBDBD; line-height: 1.6; }
    .kp-memo-footer { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 10px; }
    .kp-memo-icon { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; color: #9CA3AF; cursor: pointer; border: none; background: none; border-radius: 4px; transition: color 0.12s, background 0.12s; }
    .kp-memo-icon:hover { color: #6B7280; background: rgba(0,0,0,0.05); }

    /* Search section */
    .kp-search-section { }
    .kp-section-title { font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 14px; }
    .kp-tab-row { display: flex; align-items: center; border-bottom: 1px solid #E5E7EB; margin-bottom: 16px; }
    .kp-tab { padding: 9px 2px; margin-right: 20px; font-size: 14px; font-weight: 500; color: #6B7280; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s, border-color 0.15s; white-space: nowrap; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; }
    .kp-tab.active { color: #111827; font-weight: 700; border-bottom-color: #00AACB; }
    .kp-tab-notice { display: flex; align-items: center; gap: 5px; margin-left: auto; font-size: 12px; color: #9CA3AF; padding-bottom: 10px; }
    .kp-tab-notice svg { flex-shrink: 0; color: #F59E0B; }

    .kp-folder-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #374151; margin-bottom: 10px; }
    .kp-search-bar { display: flex; margin-bottom: 10px; }
    .kp-search-input { flex: 1; height: 38px; border: 1px solid #D1D5DB; border-radius: 6px 0 0 6px; font-size: 14px; font-family: inherit; color: #111827; padding: 0 14px; outline: none; }
    .kp-search-input:focus { border-color: #00AACB; }
    .kp-search-btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 38px; background: #00AACB; color: #fff; border: none; border-radius: 0 6px 6px 0; cursor: pointer; flex-shrink: 0; transition: background 0.15s; }
    .kp-search-btn:hover { background: #008FA8; }
    .kp-search-helpers { display: flex; align-items: center; gap: 4px; }
    .kp-helper-link { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #6B7280; cursor: pointer; padding: 3px 6px; border-radius: 4px; transition: color 0.12s, background 0.12s; text-decoration: none; }
    .kp-helper-link:hover { color: #374151; background: #F3F4F6; }
    .kp-helper-sep { color: #E5E7EB; font-size: 12px; }
  </style>
</head>

<script>
  function setTab(el) {
    document.querySelectorAll('.kp-tab').forEach(function(t) { t.classList.remove('active'); });
    el.classList.add('active');
  }
  document.querySelector('.kp-tree-section .kp-tree-arrow').style.transform = 'rotate(90deg)';

  // 헤더 유저 영역
  (function() {
    var user;
    try { user = JSON.parse(localStorage.getItem('kw_user')); } catch(e) { user = null; }
    var el = document.getElementById('kpHeaderUser');
    if (!el) return;
    if (user) {
      el.innerHTML =
        '<div class="user-info">' +
          '<div class="user-icon">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' +
          '</div>' +
          '<span style="font-size:12px;font-weight:500;color:#374151;margin-left:6px;">' + user.name + '</span>' +
        '</div>' +
        '<div class="btn-divider"></div>' +
        '<button class="btn-text" onclick="kpLogout()">로그아웃</button>';
    } else {
      el.innerHTML =
        '<span style="font-size:12px;color:#374151;font-weight:500;">김형섭</span>' +
        '<div class="btn-divider"></div>' +
        '<button class="btn-text" onclick="kpLogout()">로그아웃</button>';
    }
  })();

  function kpLogout() {
    localStorage.removeItem('kw_user');
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
