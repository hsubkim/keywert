<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>keywert > 로그인</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      padding: 20px 32px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo-img {
      height: 26px;
      width: auto;
      display: block;
    }

    .logo-fallback {
      display: none;
      align-items: center;
      gap: 7px;
      font-size: 18px;
      font-weight: 700;
      color: #29B8D8;
      letter-spacing: -0.02em;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 80px;
    }

    .form-wrap {
      width: 100%;
      max-width: 320px;
    }

    .form-title {
      font-size: 26px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 32px;
      letter-spacing: -0.02em;
    }

    .field {
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    .field-input-wrap {
      position: relative;
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #111827;
      background: #fff;
      border: 1.5px solid #D1D5DB;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field-input::placeholder { color: #9CA3AF; }

    .field-input:focus {
      border-color: #0BB8C9;
      box-shadow: 0 0 0 3px rgba(11,184,201,0.12);
    }

    .field-input.has-toggle { padding-right: 44px; }

    /* ── Quick account picker ── */
    .account-picker {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: #fff;
      border: 1.5px solid #D1D5DB;
      border-radius: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.09);
      z-index: 100;
      overflow: hidden;
      display: none;
    }
    .account-picker.open { display: block; }

    .account-pick-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .account-pick-item:hover { background: #F3F4F6; }
    .account-pick-item + .account-pick-item { border-top: 1px solid #F3F4F6; }

    .account-pick-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .account-pick-badge.free  { background: #F3F4F6; color: #6B7280; }
    .account-pick-badge.paid  { background: #D0F5F9; color: #29B8D8; }
    .account-pick-badge.trial { background: #DCFCE7; color: #16A34A; }

    .account-pick-id {
      font-size: 13px;
      font-weight: 500;
      color: #111827;
      flex: 1;
    }
    .account-pick-hint {
      font-size: 11px;
      color: #9CA3AF;
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9CA3AF;
      display: flex;
      align-items: center;
      padding: 4px;
      transition: color 0.15s;
    }

    .toggle-pw:hover { color: #6B7280; }

    .forgot-link {
      display: block;
      font-size: 12px;
      color: #6B7280;
      text-decoration: none;
      margin-top: 6px;
      transition: color 0.15s;
    }

    .forgot-link:hover { color: #111827; }

    .btn-submit {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      background: #0BB8C9;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      letter-spacing: 0.01em;
    }

    .btn-submit:hover { background: #09A5B5; }

    /* ── OR divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: #E5E7EB;
    }

    .divider-text {
      font-size: 12px;
      color: #9CA3AF;
      flex-shrink: 0;
    }

    /* ── Social buttons ── */
    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
      border: 1.5px solid #E5E7EB;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      color: #374151;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .btn-social:hover { border-color: #D1D5DB; background: #F9FAFB; }

    /* ── Bottom link ── */
    .bottom-text {
      text-align: center;
      font-size: 13px;
      color: #6B7280;
      margin-top: 28px;
    }

    .bottom-text a {
      color: #0BB8C9;
      font-weight: 600;
      text-decoration: none;
    }

    .bottom-text a:hover { text-decoration: underline; }

    /* ── Google icon ── */
    .google-icon { width: 18px; height: 18px; }

    /* ── Microsoft icon ── */
    .ms-icon { width: 18px; height: 18px; }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <img src="logo.png" alt="keywert" class="logo-img"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <span class="logo-fallback">
      <svg width="24" height="20" viewBox="0 0 34 28" fill="none">
        <circle cx="17" cy="14" r="6.5" fill="#29B8D8"/>
        <circle cx="7.5" cy="9"  r="4.5" fill="#29B8D8" opacity="0.85"/>
        <circle cx="7.5" cy="20" r="3"   fill="#29B8D8" opacity="0.7"/>
        <circle cx="27" cy="8"   r="3.5" fill="#29B8D8" opacity="0.8"/>
        <circle cx="28" cy="20"  r="2.5" fill="#29B8D8" opacity="0.6"/>
      </svg>
      <span>keywert</span>
    </span>
  </a>
</header>

<main>
  <div class="form-wrap">
    <h1 class="form-title">로그인</h1>

    <div class="field">
      <label class="field-label" for="email">이메일 또는 아이디</label>
      <div class="field-input-wrap" style="position:relative;">
        <input id="email" type="text" class="field-input" placeholder="user1234@wert.co.kr" autocomplete="off"
               onfocus="openPicker()" oninput="openPicker()">
        <div class="account-picker" id="accountPicker">
          <div class="account-pick-item" onclick="pickAccount('wert_free')">
            <span class="account-pick-badge free">무료</span>
            <span class="account-pick-id">wert_free</span>
            <span class="account-pick-hint">pw: 1111</span>
          </div>
          <div class="account-pick-item" onclick="pickAccount('wert_paid')">
            <span class="account-pick-badge paid">유료</span>
            <span class="account-pick-id">wert_paid</span>
            <span class="account-pick-hint">pw: 1111</span>
          </div>
          <div class="account-pick-item" onclick="pickAccount('wert_trial')">
            <span class="account-pick-badge trial">체험</span>
            <span class="account-pick-id">wert_trial</span>
            <span class="account-pick-hint">pw: 1111</span>
          </div>
        </div>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="password">비밀번호</label>
      <div class="field-input-wrap">
        <input id="password" type="password" class="field-input has-toggle" placeholder="••••••••" autocomplete="current-password">
        <button class="toggle-pw" type="button" onclick="togglePw('password', this)" aria-label="비밀번호 표시/숨기기">
          <svg id="eye-login" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <a href="#" class="forgot-link">비밀번호를 잊으셨나요?</a>
    </div>

    <button class="btn-submit" type="button" onclick="handleLogin()">로그인</button>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">또는</span>
      <div class="divider-line"></div>
    </div>

    <a href="#" class="btn-social">
      <!-- Google icon -->
      <svg class="google-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
        <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Google로 로그인
    </a>

    <a href="#" class="btn-social">
      <!-- Microsoft icon -->
      <svg class="ms-icon" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="9" height="9" fill="#F25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7FBA00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00A4EF"/>
        <rect x="11" y="11" width="9" height="9" fill="#FFB900"/>
      </svg>
      Microsoft로 로그인
    </a>

    <p class="bottom-text">계정이 없으신가요? <a href="signup.html">가입하기</a></p>
  </div>
</main>

<script>
  const KW_USERS = {
    'wert_free':  { name: '김무료', type: 'free' },
    'wert_paid':  { name: '김유료', type: 'paid' },
    'wert_trial': { name: '김체험', type: 'trial' }
  };
  const KW_PASSWORD = '1111';

  function openPicker() {
    document.getElementById('accountPicker').classList.add('open');
  }

  function closePicker() {
    document.getElementById('accountPicker').classList.remove('open');
  }

  function pickAccount(id) {
    document.getElementById('email').value = id;
    document.getElementById('password').value = KW_PASSWORD;
    closePicker();
    document.getElementById('password').focus();
  }

  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.querySelector('svg').style.opacity = isHidden ? '0.4' : '1';
  }

  function handleLogin() {
    const id = document.getElementById('email').value.trim();
    const pw = document.getElementById('password').value;

    if (!id || !pw) {
      showError('아이디와 비밀번호를 입력해 주세요.');
      return;
    }

    const user = KW_USERS[id];
    if (!user || pw !== KW_PASSWORD) {
      showError('아이디 또는 비밀번호가 올바르지 않습니다.');
      return;
    }

    localStorage.setItem('kw_user', JSON.stringify(user));
    const redirect = sessionStorage.getItem('kw_redirect');
    sessionStorage.removeItem('kw_redirect');
    window.location.href = redirect || 'index.html';
  }

  function showError(msg) {
    let el = document.getElementById('loginError');
    if (!el) {
      el = document.createElement('p');
      el.id = 'loginError';
      el.style.cssText = 'font-size:13px;color:#EF4444;margin-top:8px;text-align:center;';
      document.querySelector('.btn-submit').insertAdjacentElement('afterend', el);
    }
    el.textContent = msg;
  }

  document.addEventListener('DOMContentLoaded', function() {
    ['email','password'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') handleLogin();
        if (e.key === 'Escape') closePicker();
      });
    });

    // picker: 외부 클릭 시 닫기
    document.addEventListener('mousedown', function(e) {
      const picker = document.getElementById('accountPicker');
      if (picker && !picker.contains(e.target) && e.target.id !== 'email') {
        closePicker();
      }
    });

    if (localStorage.getItem('kw_user')) window.location.href = 'index.html';
  });
</script>
</body>
</html>
