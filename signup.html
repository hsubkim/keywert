<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>keywert > 회원가입</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      padding: 20px 32px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo-img {
      height: 26px;
      width: auto;
      display: block;
    }

    .logo-fallback {
      display: none;
      align-items: center;
      gap: 7px;
      font-size: 18px;
      font-weight: 700;
      color: #29B8D8;
      letter-spacing: -0.02em;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 80px;
    }

    .form-wrap {
      width: 100%;
      max-width: 320px;
    }

    .form-title {
      font-size: 26px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 32px;
      letter-spacing: -0.02em;
    }

    .field {
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    .field-label .required {
      color: #EF4444;
      margin-left: 2px;
    }

    .field-input-wrap {
      position: relative;
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #111827;
      background: #fff;
      border: 1.5px solid #D1D5DB;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field-input::placeholder { color: #9CA3AF; }

    .field-input:focus {
      border-color: #0BB8C9;
      box-shadow: 0 0 0 3px rgba(11,184,201,0.12);
    }

    .field-input.has-toggle { padding-right: 44px; }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9CA3AF;
      display: flex;
      align-items: center;
      padding: 4px;
      transition: color 0.15s;
    }

    .toggle-pw:hover { color: #6B7280; }

    .btn-submit {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      background: #0BB8C9;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      letter-spacing: 0.01em;
    }

    .btn-submit:hover { background: #09A5B5; }

    /* ── OR divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: #E5E7EB;
    }

    .divider-text {
      font-size: 12px;
      color: #9CA3AF;
      flex-shrink: 0;
    }

    /* ── Social buttons ── */
    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
      border: 1.5px solid #E5E7EB;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      color: #374151;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .btn-social:hover { border-color: #D1D5DB; background: #F9FAFB; }

    .google-icon { width: 18px; height: 18px; }
    .ms-icon { width: 18px; height: 18px; }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <img src="logo.png" alt="keywert" class="logo-img"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <span class="logo-fallback">
      <svg width="24" height="20" viewBox="0 0 34 28" fill="none">
        <circle cx="17" cy="14" r="6.5" fill="#29B8D8"/>
        <circle cx="7.5" cy="9"  r="4.5" fill="#29B8D8" opacity="0.85"/>
        <circle cx="7.5" cy="20" r="3"   fill="#29B8D8" opacity="0.7"/>
        <circle cx="27" cy="8"   r="3.5" fill="#29B8D8" opacity="0.8"/>
        <circle cx="28" cy="20"  r="2.5" fill="#29B8D8" opacity="0.6"/>
      </svg>
      <span>keywert</span>
    </span>
  </a>
</header>

<main>
  <div class="form-wrap">
    <h1 class="form-title">회원가입</h1>

    <div class="field">
      <label class="field-label" for="email">
        이메일 <span class="required">*</span>
      </label>
      <div class="field-input-wrap">
        <input id="email" type="email" class="field-input" placeholder="user1234@wert.co.kr" autocomplete="email">
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="password">
        비밀번호 <span class="required">*</span>
      </label>
      <div class="field-input-wrap">
        <input id="password" type="password" class="field-input has-toggle" placeholder="••••••••" autocomplete="new-password">
        <button class="toggle-pw" type="button" onclick="togglePw('password', this)" aria-label="비밀번호 표시/숨기기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-submit" type="button" onclick="handleSignup()">이메일로 가입하기</button>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">또는</span>
      <div class="divider-line"></div>
    </div>

    <a href="#" class="btn-social">
      <svg class="google-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
        <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Google로 가입하기
    </a>

    <a href="#" class="btn-social">
      <svg class="ms-icon" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="9" height="9" fill="#F25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7FBA00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00A4EF"/>
        <rect x="11" y="11" width="9" height="9" fill="#FFB900"/>
      </svg>
      Microsoft로 가입하기
    </a>
  </div>
</main>

<script>
  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.querySelector('svg').style.opacity = isHidden ? '0.4' : '1';
  }

  function handleSignup() {
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('password').value;
    if (!email) { alert('이메일을 입력해 주세요.'); return; }
    if (!email.includes('@')) { alert('유효한 이메일 주소를 입력해 주세요.'); return; }
    if (!pw || pw.length < 8) { alert('비밀번호를 8자 이상 입력해 주세요.'); return; }
    // 실제 회원가입 로직 연결 지점
    alert('회원가입 처리 예정');
  }
</script>
</body>
</html>
