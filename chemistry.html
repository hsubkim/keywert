<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>keywert > Chemistry</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #fff; min-width: 1280px; }
    .container { max-width: 1160px; margin: 0 auto; padding: 0 52px; }

    header {
      position: sticky; top: 0; z-index: 200;
      background: #fff; border-bottom: 1px solid #E5E7EB;
    }
    header .container { max-width: none; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #111827; font-size: 20px; font-weight: 700; }
    nav { display: flex; align-items: center; gap: 2px; }
    .nav-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 8px 14px; font-size: 15px; font-weight: 500;
      color: #374151; cursor: pointer; border-radius: 8px;
      background: none; border: none; font-family: inherit; transition: background 0.15s;
    }
    .nav-btn:hover { background: #F3F4F6; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-chemistry {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border: 1.5px solid #7C3AED;
      border-radius: 8px; color: #7C3AED; font-size: 14px; font-weight: 600;
      background: #F5F3FF; cursor: pointer; text-decoration: none;
    }
    .btn-login { padding: 7px 14px; font-size: 14px; font-weight: 500; color: #374151; text-decoration: none; border-radius: 8px; }
    .btn-primary { padding: 8px 18px; background: #00AACB; color: #fff; font-size: 14px; font-weight: 600; border-radius: 8px; text-decoration: none; border: none; cursor: pointer; white-space: nowrap; }

    .page-hero {
      padding: 80px 0 60px;
      background: linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 100%);
      text-align: center;
    }
    .page-badge {
      display: inline-block; font-size: 12px; font-weight: 700;
      color: #7C3AED; letter-spacing: 0.1em; text-transform: uppercase;
      background: #EDE9FE; padding: 4px 12px; border-radius: 20px; margin-bottom: 20px;
    }
    .page-title { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 16px; }
    .page-sub { font-size: 17px; color: #6B7280; margin-bottom: 36px; }
    .page-cta {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 15px 30px; background: #7C3AED; color: #fff;
      font-size: 16px; font-weight: 700; border-radius: 10px; text-decoration: none;
    }
    .page-cta:hover { background: #6D28D9; }

    .placeholder-section { padding: 120px 0; text-align: center; background: #F9FAFB; }
    .placeholder-section h2 { font-size: 28px; font-weight: 700; color: #9CA3AF; margin-bottom: 12px; }
    .placeholder-section p { font-size: 15px; color: #D1D5DB; }

    footer { background: #0C1222; padding: 40px 0; text-align: center; font-size: 13px; color: #334155; }
  </style>
</head>
<body>

<header>
  <div class="container">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
          <circle cx="15" cy="15" r="15" fill="#111827"/>
          <path d="M6 17 Q9.5 9 13 17 Q16.5 25 20 17 Q22 13 24 17" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        </svg>
        keywert
      </a>
      <nav>
        <button class="nav-btn" onclick="location.href='insight.html'">
          Insight
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="nav-btn" onclick="location.href='pro.html'">
          Pro
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </nav>
      <div class="header-actions">
        <a href="chemistry.html" class="btn-chemistry">
          <svg width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 1h4M5 1v5L1 13h12L9 6V1"/></svg>
          Chemistry
        </a>
        <a href="#" class="btn-login">로그인</a>
        <a href="#" class="btn-primary">무료체험 시작하기</a>
      </div>
    </div>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <p class="page-badge">CHEMISTRY MODE</p>
    <h1 class="page-title">바이오·화학 특허 검색</h1>
    <p class="page-sub">SMILES 구조식·서열(BLAST) 기반 특허 검색<br>바이오 화학 전문가를 위한 구조식 & 서열 분석</p>
    <a href="#" class="page-cta">자세히 보기</a>
  </div>
</section>

<section class="placeholder-section">
  <div class="container">
    <h2>페이지 준비 중</h2>
    <p>Chemistry 서비스 상세 페이지를 곧 만나보실 수 있습니다.</p>
  </div>
</section>

<footer>
  <div class="container">
    <p>© 2024 keywert. All rights reserved. &nbsp;|&nbsp; <a href="index.html" style="color:#64748B;">홈으로 돌아가기</a></p>
  </div>
</footer>

</body>
</html>
