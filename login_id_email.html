<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>keywert 5.0 > 통합 이메일 아이디 발급</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 32px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo-img {
      height: 26px;
      width: auto;
      display: block;
    }

    .logo-fallback {
      display: none;
      align-items: center;
      gap: 7px;
      font-size: 18px;
      font-weight: 700;
      color: #29B8D8;
      letter-spacing: -0.02em;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 80px;
    }

    .form-wrap {
      width: 100%;
      max-width: 320px;
    }

    .form-title {
      font-size: 26px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .form-desc {
      font-size: 14px;
      font-weight: 400;
      color: rgba(30,30,30,0.55);
      line-height: 150%;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field-label {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    .required { color: #F04452; }

    .field-input-wrap {
      position: relative;
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #111827;
      background: #fff;
      border: 1.5px solid #D1D5DB;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field-input::placeholder { color: #9CA3AF; }

    .field-input:focus {
      border-color: #0BB8C9;
      box-shadow: 0 0 0 3px rgba(11,184,201,0.12);
    }

    .field-input.has-toggle { padding-right: 44px; }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9CA3AF;
      display: flex;
      align-items: center;
      padding: 4px;
      transition: color 0.15s;
    }

    .toggle-pw:hover { color: #6B7280; }

    .btn-submit {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      background: #0BB8C9;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      letter-spacing: 0.01em;
    }

    .btn-submit:hover { background: #09A5B5; }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <img src="logo.png" alt="keywert" class="logo-img"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <span class="logo-fallback">
      <svg width="24" height="20" viewBox="0 0 34 28" fill="none">
        <circle cx="17" cy="14" r="6.5" fill="#29B8D8"/>
        <circle cx="7.5" cy="9"  r="4.5" fill="#29B8D8" opacity="0.85"/>
        <circle cx="7.5" cy="20" r="3"   fill="#29B8D8" opacity="0.7"/>
        <circle cx="27" cy="8"   r="3.5" fill="#29B8D8" opacity="0.8"/>
        <circle cx="28" cy="20"  r="2.5" fill="#29B8D8" opacity="0.6"/>
      </svg>
      <span>keywert</span>
    </span>
  </a>
</header>

<main>
  <div class="form-wrap">

    <h1 class="form-title">통합 이메일 아이디 발급</h1>
    <p class="form-desc">키워트의 통합 이메일 아이디 발급이 필요합니다.<br>아이디로 사용할 이메일과 비밀번호를 입력해 주세요.</p>

    <div class="field">
      <label class="field-label" for="emailInput">업무용 이메일 <span class="required">*</span></label>
      <div class="field-input-wrap">
        <input id="emailInput" type="email" class="field-input" value="wertie@wert.co.kr">
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="pwInput">비밀번호 <span class="required">*</span></label>
      <div class="field-input-wrap">
        <input id="pwInput" type="password" class="field-input has-toggle" value="12345678">
        <button class="toggle-pw" type="button" onclick="togglePw()" aria-label="비밀번호 표시/숨기기">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-submit" type="button" onclick="handleSend()">인증번호 발송</button>

  </div>
</main>

<script>
  function togglePw() {
    const input = document.getElementById('pwInput');
    const icon = document.getElementById('eyeIcon');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    icon.style.opacity = isHidden ? '0.4' : '1';
  }

  function handleSend() {
    const email = document.getElementById('emailInput').value.trim();
    sessionStorage.setItem('id_issue_email', email);
    location.href = 'login_id_verify.html';
  }
</script>
</body>
</html>
