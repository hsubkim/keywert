<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>keywert > 이메일 인증</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 32px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo-img {
      height: 26px;
      width: auto;
      display: block;
    }

    .logo-fallback {
      display: none;
      align-items: center;
      gap: 7px;
      font-size: 18px;
      font-weight: 700;
      color: #29B8D8;
      letter-spacing: -0.02em;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 80px;
    }

    .form-wrap {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    .title-area {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .title-texts {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-title {
      font-size: 28px;
      font-weight: 700;
      color: #000;
      line-height: 136%;
      letter-spacing: -0.02em;
    }

    .form-desc {
      font-size: 18px;
      font-weight: 400;
      color: rgba(30, 30, 30, 0.69);
      line-height: 150%;
    }

    .form-desc strong {
      font-weight: 700;
      color: rgba(30, 30, 30, 0.69);
    }

    .timer {
      font-size: 18px;
      font-weight: 400;
      color: rgba(30, 30, 30, 0.42);
      line-height: 150%;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .otp-row {
      display: flex;
      gap: 16px;
    }

    .otp-box {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 0;
      border: 1px solid rgba(30, 30, 30, 0.12);
      border-radius: 8px;
      font-size: 24px;
      font-weight: 700;
      color: rgba(30, 30, 30, 0.84);
      line-height: 132%;
      min-height: 56px;
    }

    .otp-box.active {
      border-color: #00A08C;
      border-width: 1.5px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn-resend {
      flex: 1;
      padding: 14px 16px;
      background: rgba(90, 90, 90, 0.08);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      color: rgba(30, 30, 30, 0.84);
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-resend:hover { background: rgba(90, 90, 90, 0.14); }

    .btn-verify {
      flex: 1;
      padding: 14px 16px;
      background: #0BB8C9;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-verify:hover { background: #09A5B5; }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <img src="logo.png" alt="keywert" class="logo-img"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <span class="logo-fallback">
      <svg width="24" height="20" viewBox="0 0 34 28" fill="none">
        <circle cx="17" cy="14" r="6.5" fill="#29B8D8"/>
        <circle cx="7.5" cy="9"  r="4.5" fill="#29B8D8" opacity="0.85"/>
        <circle cx="7.5" cy="20" r="3"   fill="#29B8D8" opacity="0.7"/>
        <circle cx="27" cy="8"   r="3.5" fill="#29B8D8" opacity="0.8"/>
        <circle cx="28" cy="20"  r="2.5" fill="#29B8D8" opacity="0.6"/>
      </svg>
      <span>keywert</span>
    </span>
  </a>
</header>

<main>
  <div class="form-wrap">

    <div class="title-area">
      <div class="title-texts">
        <h1 class="form-title">이메일 인증</h1>
        <p class="form-desc">
          <strong id="email-display">wertie@wert.co.kr</strong>(으)로 인증번호를 전송했습니다.<br>
          인증번호가 오지 않았다면 스팸함을 확인해주세요.
        </p>
      </div>
      <p class="timer" id="timer">남은 시간 5:00</p>
    </div>

    <div class="input-section">
      <div class="otp-row">
        <div class="otp-box">7</div>
        <div class="otp-box">2</div>
        <div class="otp-box">8</div>
        <div class="otp-box">3</div>
        <div class="otp-box">9</div>
        <div class="otp-box">2</div>
      </div>

      <div class="btn-row">
        <button class="btn-resend" type="button" onclick="resetTimer()">재전송</button>
        <button class="btn-verify" type="button" onclick="handleVerify()">인증</button>
      </div>
    </div>

  </div>
</main>

<script>
  const saved = sessionStorage.getItem('id_issue_email');
  document.getElementById('email-display').textContent = saved || 'wertie@wert.co.kr';

  let seconds = 300;
  const timerEl = document.getElementById('timer');

  function tick() {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    timerEl.textContent = '남은 시간 ' + m + ':' + String(s).padStart(2, '0');
    if (seconds > 0) seconds--;
  }

  tick();
  let timerId = setInterval(tick, 1000);

  function resetTimer() {
    clearInterval(timerId);
    seconds = 300;
    tick();
    timerId = setInterval(tick, 1000);
  }

  function handleVerify() {
    location.href = 'login_id_complete.html';
  }
</script>
</body>
</html>
